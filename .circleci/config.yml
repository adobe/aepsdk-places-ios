# For a detailed guide to building and testing on iOS, read the docs:
# https://circleci.com/docs/2.0/testing-ios/

version: 2.1

orbs:
  # codecov: codecov/codecov@3.3.0
  macos: circleci/macos@2

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - validate-code
      - test-ios:
          requires:
            - validate-code
      - test-spm-podspec-archive:
          requires:
            - validate-code
      - build-swift6:
          requires:
            - validate-code
      - build-min-toolchain:
          requires:
            - validate-code

commands:
  install_dependencies:
    steps:
      - restore_cache:
          name: Restore Gemfile cache
          keys:
            - gems-v1-{{ checksum "Gemfile.lock" }}
            - gems-v1-

      - run:
          name: Configure Bundler
          command: |
            bundle config set path 'vendor/bundle'
            bundle check || bundle install

      - save_cache:
          name: Save Gemfile cache
          key: gems-v1-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      - restore_cache:
          name: Restore CocoaPods cache
          keys:
            - pods-v1-{{ checksum "Podfile.lock" }}
            - pods-v1-

      - run:
          name: Install CocoaPods
          command: make ci-pod-install

      - save_cache:
          name: Save CocoaPods cache
          key: pods-v1-{{ checksum "Podfile.lock" }}
          paths:
            - Pods
            - ~/.cocoapods

  prestart_ios_simulator:
    steps:
      - macos/preboot-simulator:
          platform: "iOS"
          version: "27.0"
          device: "iPhone 18 Pro"

jobs:
  validate-code:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0 # Specify the Xcode version to use

    steps:
      - checkout

      - install_dependencies

      - run:
          name: Lint Source Code
          command: make lint

  test-ios:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0 # Specify the Xcode version to use

    steps:
      - checkout

      - install_dependencies

      - prestart_ios_simulator

      - run:
          name: Run AEPPlaces Tests
          command: make test

      # Code coverage upload using Codecov
      # See options explanation here: https://docs.codecov.com/docs/codecov-uploader
      # - codecov/upload:
      #     flags: aepplaces-ios-tests
      #     upload_name: Coverage Report for AEPPlaces iOS Tests
      #     xtra_args: -c -v --xc --xp ./build/AEPPlaces.xcresult

  test-spm-podspec-archive:  
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0 # Specify the Xcode version to use
    
    steps:
      - checkout
      - install_dependencies
      # verify XCFramework archive builds
      - run:
          name: Build XCFramework
          command: |
            if [ "${CIRCLE_BRANCH}" == "main" ] || [ "${CIRCLE_BRANCH}" == "staging" ]; then
              make ci-archive
            fi
      # verify podspec is valid
      # - run:
      #     name: Test Podspec
      #     command: |
      #       if [ "${CIRCLE_BRANCH}" == "main" ]; then
      #         make test-podspec
      #       fi
      # verify SPM works
      - run:
          name: Test SPM 
          command: |
            if [ "${CIRCLE_BRANCH}" == "main" ] || [ "${CIRCLE_BRANCH}" == "staging" ]; then
              make test-SPM-integration
            fi

  # Swift 6 language-mode coverage. Selecting Xcode 27 does not select Swift 6
  # mode (checked-in targets are SWIFT_VERSION = 5.0), so this lane builds the
  # AEPPlaces target in Swift 6 via AEPPLACES_SWIFT_VERSION (referenced only by that
  # target), then compiles a Swift 6 consumer that calls the public
  # completion-handler APIs with plain closures from @MainActor code. Dependencies
  # keep their own declared language modes (matching a real Swift 6 app), so this
  # does not force unreleased dependencies into Swift 6. This continuously protects the
  # @Sendable / @preconcurrency boundary this PR adds.
  # The full Swift 6 consumer *runtime* probe lands with the dependency-minimum
  # bump, once the fixed @Sendable AEPCore releases are published.
  build-swift6:
    resource_class: m4pro.medium
    macos:
      xcode: 27.0.0

    steps:
      - checkout
      - install_dependencies
      - run:
          name: Build AEPPlaces in Swift 6 language mode (dependencies keep their modes)
          command: make build-swift6
      - run:
          name: Build Swift 6 consumer (plain closures from @MainActor)
          command: make test-swift6-consumer

  # Minimum-supported-toolchain coverage. README advertises Xcode 15.3+ / Swift
  # 5.10 as the floor; 15.4 is the oldest 15.x image CircleCI still hosts and
  # ships the same Swift 5.10 compiler. Compile-only (no iOS 27 runtime) to catch
  # accidental use of APIs/features newer than the advertised minimum.
  build-min-toolchain:
    resource_class: m4pro.medium
    macos:
      xcode: 15.4.0

    steps:
      - checkout
      - install_dependencies
      - run:
          name: Build AEPPlaces on minimum supported toolchain (Xcode 15.4 / Swift 5.10)
          command: make build-min-toolchain
